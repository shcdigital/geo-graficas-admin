image: node:20-alpine

# Variable requerida al ejecutar el pipeline (Settings > CI/CD > Variables):
#   GITLAB_PAGES_WORKER_BASE = https://geo-graficas-admin.<tu-subdominio>.workers.dev
# Sirve para inyectar la URL del Worker en el panel estático (admin.html).

pages:
  stage: deploy
  script:
    - mkdir -p public
    - sed "s|__WORKER_BASE__|${GITLAB_PAGES_WORKER_BASE}|g" src/admin.txt > public/index.html
    - ls -la public
  artifacts:
    paths:
      - public
  only:
    - main