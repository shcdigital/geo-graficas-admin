image: node:20-alpine

# Variables requeridas al ejecutar el pipeline (Settings > CI/CD > Variables):
#   GITLAB_PAGES_WORKER_BASE = https://geo-graficas-admin.<tu-subdominio>.workers.dev
#   GITLAB_PAGES_SITE_URL    = dominio público del sitio (geo-graficas-web)
#   GITLAB_PAGES_CLIENTES_URL= base del panel de clientes (SSO)
#   CLOUDFLARE_API_TOKEN     = token de Cloudflare (scope Workers Scripts:Edit) para deploy automático
# Sirven para inyectar la URL del Worker y los enlaces en el panel estático (admin.html).

stages:
  - build
  - deploy

pages:
  stage: build
  script:
    - mkdir -p public
    - sed -e "s|__WORKER_BASE__|${GITLAB_PAGES_WORKER_BASE:-https://panel.geograficas.shcdigital.net.ar}|g" -e "s|__SITE_URL__|${GITLAB_PAGES_SITE_URL:-https://geo-graficas-web-d6a153.gitlab.io}|g" -e "s|__CLIENTES_URL__|${GITLAB_PAGES_CLIENTES_URL:-https://clientes.shcdigital.net.ar}|g" src/admin.txt > public/index.html
    - ls -la public
  artifacts:
    paths:
      - public
  only:
    - main

deploy-worker:
  stage: deploy
  script:
    - npm ci --cache .npm --no-audit --no-fund
    - npm run deploy
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  only:
    - main