name = "geo-graficas-admin"
main = "src/index.js"
compatibility_date = "2026-08-06"
account_id = "d1509c610d7908f0f340251a340ddf4c"

# Dominio de producción para este panel (subdominio propio bajo shcdigital.net.ar)
[[routes]]
pattern = "panel.geograficas.shcdigital.net.ar"
custom_domain = true

# Sesiones de login (SSO + local)
[[kv_namespaces]]
binding = "SESSIONS"
id = "6ce05e2073b94d0b8e011610d30c92d2"

# Variables de entorno (no secretas)
[vars]
APP_NAME = "Geo.Gráficas Admin"
SITE_URL = "https://geo-graficas-web-d6a153.gitlab.io"
# Base del panel de clientes (SSO)
CLIENTES_URL = "https://clientes.shcdigital.net.ar"
# URL pública de este panel; debe coincidir con el "aud" (admin_url) que firma el SSO
PANEL_URL = "https://panel.geograficas.shcdigital.net.ar"
# Id único de este cliente (debe coincidir con el "id" del tenant en el SSO de clientes)
TENANT_ID = "geo-graficas"
# Emails con acceso (separados por coma)
ADMIN_EMAILS = "cambiar@ejemplo.com"
# Ruta base de los cuadernillos en el repo
CONTENT_PATH = "src/content/recursos"
# Ruta pública de las imágenes de portada en el repo (public/ se sirve tal cual)
IMG_PATH = "public/img/recursos"
DEFAULT_BRANCH = "main"
# Proyecto GitLab donde vive el contenido (geo-graficas-web)
GITLAB_PROJECT_ID = "85162233"
# Archivo canónico de precios (vive en geo-graficas-web, fuente única).
# Se usa el mismo GITLAB_TOKEN del repo web (secret).
PRICES_PATH = "src/data/prices.json"
# Destinatario de los mensajes del panel (botón "Enviar mensaje")
ADMIN_EMAIL = "shcdigitalsolutions@gmail.com"
# URL del worker geo-graficas-pay: envía el mail con su RESEND_API_KEY
# (POST /email), para no duplicar la key en este panel.
PAY_URL = "https://geo-graficas-pay.pablo-berthold.workers.dev"

# Rutas del sitio público (para anclas/links)
[observability]
enabled = true
